riot_api:
  region: "na1"
  queue_id: 420  # Ranked Solo/Duo
  tier: "DIAMOND"
  divisions: ["I", "II", "III", "IV"]

collection:
  max_matches_per_player: 20
  max_seed_players: 4000  # Keep local crawl size manageable; increase gradually as needed
  store_raw_json: false   # Save disk by exporting directly to CSV during crawl
  csv_output_path: "data/processed/compositions_stats.csv"
  min_game_duration: 900  # 15 minutes in seconds
  min_remake_duration: 180  # 3 minutes
  require_valid_position: true

features:
  num_champions: 172
  champion_embedding_dim: 32

training:
  test_size: 0.15
  val_size: 0.15
  random_state: 42
  split_method: "time_based"  # time_based or random
